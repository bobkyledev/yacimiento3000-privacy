<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Política de Privacidad - Digcremental</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F6F6;--card:#FFFFFF;--primary:#748DAE;--text:#1E293B;--muted:#475569;--border:#E2E8F0}
@media (prefers-color-scheme:dark){:root{--bg:#0C0F0F;--card:#1A1C1C;--text:#F1F5F9;--muted:#94A3B8;--border:#334155}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding:40px 16px}
.container{max-width:800px;margin:0 auto;background:var(--card);padding:40px 28px;border-radius:24px;border:1px solid var(--border)}
header{text-align:center;margin-bottom:32px;border-bottom:2px solid var(--border);padding-bottom:20px}
h1{color:var(--primary);font-size:2.2rem;line-height:1.2;margin-bottom:8px}
h2{font-size:1.35rem;margin:28px 0 12px}
p,li{color:var(--muted);margin-bottom:12px}
ul{padding-left:22px}
a{color:var(--primary);word-break:break-word}
nav{text-align:center;margin-top:12px;font-size:.9rem}
nav a{margin:0 6px}
footer{text-align:center;margin-top:36px;font-size:.85rem;color:var(--muted)}</style>
</head>
<body>
<div class="container">
<header><h1>Digcremental</h1><nav><a href="./es/">Español</a> · <a href="./en/">English</a></nav></header>
<!-- https://bobkyledev.github.io/yacimiento3000-privacy/ -->
<script>(function(){var l=["es","en"];var n=(navigator.languages||[navigator.language||'']).map(function(x){return String(x).slice(0,2).toLowerCase()});for(var i=0;i<n.length;i++){if(l.indexOf(n[i])>=0){location.replace('./'+n[i]+'/');return}}location.replace('./'+l[0]+'/')})();</script>
</div>
</body>
</html>
